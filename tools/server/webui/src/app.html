<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Inline splash styles so the first paint doesn't wait on bundle.css.
			 Kept intentionally tiny — less than ~1 KB gzipped — because every
			 byte here ships before the rest of the page. -->
		<style>
			#boot-splash {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1rem;
				background: #1b1f20;
				color: #ff8236;
				font:
					500 0.9rem/1.4 system-ui,
					-apple-system,
					'Segoe UI',
					sans-serif;
				opacity: 1;
				transition: opacity 0.25s ease;
				z-index: 2147483647;
			}
			@media (prefers-color-scheme: light) {
				#boot-splash {
					background: #f6f4ee;
					color: #c94f00;
				}
			}
			#boot-splash.hide {
				opacity: 0;
				pointer-events: none;
			}
			#boot-splash svg {
				width: 64px;
				height: 64px;
				animation: boot-pulse 1.4s ease-in-out infinite;
			}
			#boot-splash .dots::after {
				content: '.';
				animation: boot-dots 1.2s steps(4, end) infinite;
			}
			@keyframes boot-pulse {
				0%,
				100% {
					transform: scale(0.92);
					opacity: 0.7;
				}
				50% {
					transform: scale(1.04);
					opacity: 1;
				}
			}
			@keyframes boot-dots {
				0% {
					content: '.';
				}
				33% {
					content: '..';
				}
				66% {
					content: '...';
				}
				100% {
					content: '';
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Boot splash — visible from the moment the HTML lands until the
			 Svelte layout's onMount fires and tags it with `.hide`. Avoids
			 the "solid-colour screen" gap while the ~2.5 MB gzipped bundle
			 downloads + evaluates on cold boot. The id is a hard-coded
			 string so +layout.svelte can target it without coupling. -->
		<div id="boot-splash" aria-hidden="true">
			<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
				<rect width="256" height="256" rx="40" fill="currentColor" opacity="0.12" />
				<circle cx="128" cy="128" r="48" fill="currentColor" opacity="0.9" />
			</svg>
			<span>ht-llama.cpp<span class="dots"></span></span>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
