[package]
name = "ht-llama-webui"
version = "0.1.0"
description = "Native desktop shell for the ht-llama.cpp WebUI"
authors = ["Heiervang Technologies"]
license = "MIT"
repository = "https://github.com/heiervang-technologies/ht-llama.cpp"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["devtools"] }
tauri-plugin-log = "2"

# Linux-only: reach into the underlying webkit2gtk webview so we can enable
# MediaStream APIs and auto-approve getUserMedia permission requests. Without
# this, getUserMedia() from the Tauri window returns NotAllowedError even
# though the desktop app already has OS-level mic access.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
