[package]
name = "ht-termd"
version = "0.1.0"
edition = "2021"
description = "Terminal-sandbox sidecar for the ht-llama.cpp webui. HTTP + WebSocket front-end that spawns gVisor-hardened unleash-sandbox containers and bridges xterm.js to their PTYs."
license = "MIT"
publish = false

[[bin]]
name = "ht-termd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws", "macros"] }
base64 = "0.22"
bollard = "0.17"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hyper = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }

[profile.release]
# Smaller binary — sidecar ships inside the Tauri bundle.
lto = "thin"
codegen-units = 1
strip = "symbols"
